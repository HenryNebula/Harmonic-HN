[project]
name = "harmonic-translation-server"
version = "0.1.0"
description = "Self-hosted comment translation cache for the Harmonic Hacker News fork"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
harmonic-translation-server = "translation_server.__main__:main"
